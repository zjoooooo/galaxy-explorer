name: CI

# Pull requests get the same checks the deploy runs before publishing (see deploy-pages.yml).
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # Dependency-free: JS syntax, asset integrity, and HTML sanity checks.
      - name: Validate (JS syntax, assets, HTML)
        run: node .github/scripts/validate.mjs
